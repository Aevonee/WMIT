<!DOCTYPE html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#1f2937;margin:0}.wrap{max-width:760px;margin:0 auto;padding:28px 16px}.card{background:#fff;border:1px solid #dfe3eb;border-radius:14px;padding:24px;box-shadow:0 4px 14px #15223812}h1{margin:0 0 8px;color:#123d73}.muted{color:#687386}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;margin:12px 0 6px}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #c8ced8;border-radius:8px;font:inherit}button{margin-top:18px;background:#174ea6;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer}.status{display:none;padding:12px;border-radius:8px;margin-top:15px}.status.show{display:block}.good{background:#e6f4ea;color:#137333}.error{background:#fce8e6;color:#a50e0e}@media(max-width:620px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="card"><div class="muted">WORLD MASTER INTERNATIONAL TRAVEL</div><h1>Request a Custom Quote</h1><p class="muted">Tell us about your trip and we’ll help create an itinerary for you.</p><form id="request-form"><div class="grid"><div><label>Name *</label><input name="name" required></div><div><label>Email *</label><input name="email" type="email" required></div><div><label>Phone / Viber / WhatsApp</label><input name="phone"></div><div><label>Destination *</label><input name="destination" required></div></div><label>Travel timing *</label><div class="grid"><div><label>Exact departure</label><input name="travel_start" type="date"></div><div><label>Exact return</label><input name="travel_end" type="date"></div><div><label>Or approximate month</label><input name="travel_month" type="month"></div><div><label>Approximate days if using month</label><input name="duration_days" type="number" min="1"></div></div><label>Travelers *</label><div class="grid"><div><label>Adults</label><input name="adults" type="number" min="0" value="1"></div><div><label>Seniors</label><input name="seniors" type="number" min="0" value="0"></div><div><label>Children</label><input id="children" name="children" type="number" min="0" value="0"></div><div><label>Infants</label><input name="infants" type="number" min="0" value="0"></div></div><label>Child ages, comma-separated if applicable</label><input name="child_ages" placeholder="Example: 6, 10"><div class="grid"><div><label>Flexible dates?</label><select name="flexible_dates"><option value="false">No</option><option value="true">Yes</option></select></div><div><label>Estimated budget per person</label><input name="budget_per_person" type="number" min="0" step="0.01"></div><div><label>Preferred hotel category</label><select name="preferred_hotel_category"><option value="">Not specified</option><option>Budget</option><option>3-star</option><option>4-star</option><option>5-star</option><option>Luxury</option></select></div><div><label>Purpose of travel</label><input name="travel_purpose" placeholder="Leisure, pilgrimage, business"></div></div><label>Special requests / notes</label><textarea name="notes" rows="5"></textarea><button id="submit">Send request</button><div id="status" class="status"></div></form></section></main><script>
function $(id){return document.getElementById(id)}function status(msg,kind){var n=$('status');n.textContent=msg;n.className='status show '+kind}function data(form){var o={};new FormData(form).forEach(function(v,k){o[k]=v});['adults','seniors','children','infants','duration_days','budget_per_person'].forEach(function(k){if(o[k]!=='')o[k]=Number(o[k]);else delete o[k]});o.child_ages=o.child_ages?o.child_ages.split(',').map(function(x){return Number(x.trim())}).filter(function(x){return !isNaN(x)}):[];o.flexible_dates=o.flexible_dates==='true';o.idempotency_key='PUBLIC-'+Date.now()+'-'+Math.random().toString(36).slice(2);return o}$('request-form').addEventListener('submit',function(e){e.preventDefault();var f=this,b=$('submit'),v=data(f);if(!v.travel_start&&!v.travel_month)return status('Provide exact dates or an approximate travel month.','error');if(v.travel_month&&!v.duration_days)return status('Please provide the approximate number of days for a month-only request.','error');if((v.adults||0)+(v.seniors||0)+(v.children||0)+(v.infants||0)<1)return status('Enter at least one traveler.','error');b.disabled=true;google.script.run.withSuccessHandler(function(r){b.disabled=false;if(!r||r.ok===false)return status(r&&r.error?r.error.message:'The request could not be submitted.','error');status('Thank you. Your request was received. Reference: '+r.data.inquiry_id,'good');f.reset()}).withFailureHandler(function(e){b.disabled=false;status(e.message||e,'error')}).webSubmitPublicQuoteRequest(v)})
</script></body></html>
