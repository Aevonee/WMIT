<!DOCTYPE html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#1f2937;margin:0}.wrap{max-width:900px;margin:0 auto;padding:24px 16px}.card{background:#fff;border:1px solid #dfe3eb;border-radius:14px;padding:26px;box-shadow:0 4px 14px #15223812}h1{color:#123d73;margin-bottom:3px}.muted{color:#687386}.meta,.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.box{padding:12px;background:#f7f9fc;border-radius:8px}table{width:100%;border-collapse:collapse;margin:14px 0}th,td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb}button{background:#174ea6;color:#fff;border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer}.status{display:none;padding:12px;border-radius:8px;margin-top:12px}.status.show{display:block}.good{background:#e6f4ea;color:#137333}.error{background:#fce8e6;color:#a50e0e}@media print{body{background:#fff}.card{box-shadow:none;border:0}button,.status{display:none!important}}@media(max-width:620px){.meta,.summary{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section id="content" class="card"><p class="muted">Loading quotation…</p></section></main><script>
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])})}function q(){return new URLSearchParams(location.search).get('token')}function showError(m){document.getElementById('content').innerHTML='<h1>Quotation unavailable</h1><p class="status show error">'+esc(m)+'</p>'}function render(p){var q=p.quotation||{},c=p.client||{},items=p.items||[],days=q.itinerary_days||[];document.getElementById('content').innerHTML='<div class="muted">WORLD MASTER INTERNATIONAL TRAVEL</div><h1>Travel Quotation</h1><div class="meta"><div class="box"><small>Prepared for</small><br><strong>'+esc(c.name||'Client')+'</strong></div><div class="box"><small>Destination</small><br><strong>'+esc(q.destination||'—')+'</strong></div><div class="box"><small>Travel dates</small><br><strong>'+esc(q.travel_start||'—')+' to '+esc(q.travel_end||'—')+'</strong></div><div class="box"><small>Travelers</small><br><strong>'+esc(q.pax_count||'—')+'</strong></div><div class="box"><small>Quotation date</small><br><strong>'+esc(q.quotation_date||'—')+'</strong></div><div class="box"><small>Valid until</small><br><strong>'+esc(q.valid_until||'—')+'</strong></div></div>'+(days.length?'<h2>Itinerary</h2>'+days.map(function(d){return '<div class="box"><strong>Day '+esc(d.day||'')+' · '+esc(d.title||d.city||'Travel day')+'</strong><p>'+esc(d.activities||'')+'</p><small>'+esc(d.meals||'')+' '+esc(d.overnight||'')+'</small></div>'}).join(''):'')+'<h2>Services</h2><table><thead><tr><th>Service</th><th>Description</th><th>Qty</th><th>Amount</th></tr></thead><tbody>'+items.map(function(i){return '<tr><td>'+esc(i.service_type)+'</td><td>'+esc(i.description)+'</td><td>'+esc(i.quantity)+'</td><td>'+esc(i.amount+' '+(i.currency||q.currency||''))+'</td></tr>'}).join('')+'</tbody></table>'+(q.inclusions?'<h2>Inclusions</h2><p>'+esc(q.inclusions)+'</p>':'')+(q.exclusions?'<h2>Exclusions</h2><p>'+esc(q.exclusions)+'</p>':'')+(q.payment_terms?'<h2>Payment terms</h2><p>'+esc(q.payment_terms)+'</p>':'')+'<div class="summary"><div class="box"><small>Total</small><br><strong>'+esc(q.client_total||'0.00')+' '+esc(q.currency||'')+'</strong></div></div><p>'+esc(q.client_notes||'')+'</p><button id="print">Print / Save PDF</button> <button id="accept">Accept quotation</button><div id="status" class="status"></div>';document.getElementById('print').onclick=function(){window.print()};document.getElementById('accept').onclick=function(){var name=window.prompt('Your name');if(!name)return;google.script.run.withSuccessHandler(function(r){var s=document.getElementById('status');s.textContent=r&&r.ok?'Thank you. Your acceptance was recorded.':'Unable to record acceptance.';s.className='status show '+(r&&r.ok?'good':'error')}).withFailureHandler(function(e){var s=document.getElementById('status');s.textContent=e.message||e;s.className='status show error'}).webAcceptPublicQuotation({token:q(),accepted_by:name})}}google.script.run.withSuccessHandler(function(r){if(!r||r.ok===false)return showError(r&&r.error?r.error.message:'Quotation unavailable.');render(r.data)}).withFailureHandler(function(e){showError(e.message||e)}).webGetPublicQuotation({token:q()})
</script></body></html>
